<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
<header class="site" id="site-header"></header>
<main style="margin-top:48px">
  <section id="login" hidden>
    <h1>Sign in</h1>
    <form class="stack" id="login-form" style="margin-top:24px">
      <label>Email<input id="email" type="email" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn solid" type="submit">Sign in</button>
      <div class="status err" id="login-status"></div>
    </form>
  </section>
  <section id="panel" class="split" style="margin-top:0" hidden>
    <div class="main">
      <h1>Add a song</h1>
      <form class="stack" id="song-form" style="margin-top:24px">
        <label>Song title<input id="title" type="text" required></label>
        <label>Video file (MP4, optional)<input id="video" type="file" accept="video/*"></label>
        <label>Release date<input id="release" type="date"></label>
        <label>Cover art (JPG or PNG, square)<input id="cover" type="file" accept="image/*"></label>
        <label>Audio file (MP3 or WAV)<input id="audio" type="file" accept="audio/*" required></label>
        <div style="display:flex;flex-wrap:wrap;gap:12px">
          <button class="btn solid" type="submit" value="publish">Publish song</button>
          <button class="btn ghost" type="submit" value="draft">Save draft</button>
        </div>
        <div class="status" id="status" role="status"></div>
      </form>
    </div>
    <aside class="side">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2>Your songs</h2><button class="btn ghost" id="logout" style="min-height:40px">Sign out</button>
      </div>
      <div id="song-list"></div>
    </aside>
  </section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
