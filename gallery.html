<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>
<div class="wrap">
<header class="site" id="site-header"></header>
<main>
  <div class="gallery-head"><h1>Gallery</h1><p>Moments from the studio, the stage and the street.</p></div>
  <div class="wall" id="wall"></div>
</main>
</div>
<dialog class="lb" id="lb" aria-label="Photo viewer">
  <button class="x" id="lb-close" aria-label="Close">&times;</button>
  <button class="prev" id="lb-prev" aria-label="Previous photo">&#8249;</button>
  <img id="lb-img" alt="">
  <button class="next" id="lb-next" aria-label="Next photo">&#8250;</button>
  <p class="count" id="lb-count"></p>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script src="js/gallery.js"></script>
</body>
</html>
